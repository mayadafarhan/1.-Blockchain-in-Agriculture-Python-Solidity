[package]
name = "blockchain-in-rust"
version = "0.1.0"
authors = ["Mfawzy <mfawzy1337@gmail.com>"]
edition = "2021"

[lib]
name = "blockchainlib"
path = "src/lib.rs"

[[bin]]
name = "blockchain"
path = "src/main.rs"

[dependencies]
hex = "0.4.3"
crypto-hash = "0.3.3"
uuid = { version = "1.3.3", features = ["v4", "serde"] }
bincode = "1.3.3"
serde = { version = "1.0.163", features = ["derive"] }
serde_bytes = "0.11.9"
serde_json = "1.0.96"
rsa = "0.9.2"
rust-crypto = "0.2"
rand = "0.8.5"
base64 = "0.21.2"
lazy_static = "1.4.0"
